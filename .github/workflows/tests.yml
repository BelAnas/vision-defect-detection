name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Serving requirements only: the tests run the committed ONNX model and need no PyTorch.
      - run: pip install -r requirements.txt
      - run: pytest -q
